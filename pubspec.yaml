name: teacher_question_paper_generator
description: Offline-first question bank and examination paper generator for teachers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  archive: ^3.6.1
  xml: ^6.5.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  sembast: ^3.8.5
  sembast_web: ^2.4.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
